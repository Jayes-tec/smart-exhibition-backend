<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — EXHIBIT/OS</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> EXHIBIT/OS</div>
    <div class="role-tag">Exhibitor Panel</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="browse-exhibitions.html">Browse Exhibitions</a>
      <a href="my-booth.html">My Booth</a>
      <a href="products.html" class="active">Products</a>
      <a href="documents.html">Documents</a>
      <a href="leads.html">Leads</a>
      <a href="staff.html">Booth Staff</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" class="logout-link">← Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h1>Products</h1>
      <div class="user-chip">
        <div class="avatar" id="userInitial">E</div>
        <span id="userName">Exhibitor</span>
      </div>
    </div>

    <div class="dash-body">

      <div class="panel">
        <div class="panel-head">
          <h3>Your Products</h3>
          <button class="btn btn-copper" id="openCreateModal">+ Add Product</button>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsBody">
            <!-- rows injected by products.js -->
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<!-- Create/Edit Product Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Add Product</h3>
      <button class="modal-close" id="closeCreateModal">&times;</button>
    </div>
    <form id="productForm">
      <div class="modal-body">
        <input type="hidden" id="product_id" name="product_id">
        <div class="field">
          <label for="product_name">Product name</label>
          <input type="text" id="product_name" name="product_name" placeholder="e.g. Smart Water Purifier" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Home Appliances">
          </div>
          <div class="field">
            <label for="price">Price (₹)</label>
            <input type="number" id="price" name="price" placeholder="e.g. 4999" min="0" step="0.01">
          </div>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Short product description"></textarea>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="error-text" id="formError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost-light" id="cancelCreate">Cancel</button>
        <button type="submit" class="btn btn-copper" id="submitBtn">Add Product</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/products.js"></script>
</body>
</html>
