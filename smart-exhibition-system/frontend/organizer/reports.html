<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — EXHIBIT/OS</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> EXHIBIT/OS</div>
    <div class="role-tag">Organizer Panel</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="exhibitions.html">Exhibitions</a>
      <a href="halls.html">Halls</a>
      <a href="booths.html">Booths</a>
      <a href="exhibitor-requests.html">Exhibitor Requests</a>
      <a href="reports.html" class="active">Reports</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" class="logout-link">← Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h1>Reports</h1>
      <div class="user-chip">
        <div class="avatar" id="userInitial">O</div>
        <span id="userName">Organizer</span>
      </div>
    </div>

    <div class="dash-body">

      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Total Footfall</div>
          <div class="value" id="statFootfall">—</div>
        </div>
        <div class="stat-card copper">
          <div class="label">Total Leads Generated</div>
          <div class="value" id="statLeads">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Avg. Feedback Rating</div>
          <div class="value" id="statRating">—</div>
        </div>
        <div class="stat-card copper">
          <div class="label">Booths Occupied</div>
          <div class="value" id="statOccupied">—</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Exhibition-wise Breakdown</h3>
          <button class="btn btn-ghost-light" id="exportBtn">Export as PDF</button>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Exhibition</th>
              <th>Visitors</th>
              <th>Leads</th>
              <th>Avg. Rating</th>
              <th>Booths Occupied</th>
            </tr>
          </thead>
          <tbody id="reportsBody">
            <!-- rows injected by reports.js -->
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
