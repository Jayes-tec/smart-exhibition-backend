<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booths — EXHIBIT/OS</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> EXHIBIT/OS</div>
    <div class="role-tag">Organizer Panel</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="exhibitions.html">Exhibitions</a>
      <a href="halls.html">Halls</a>
      <a href="booths.html" class="active">Booths</a>
      <a href="exhibitor-requests.html">Exhibitor Requests</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" class="logout-link">← Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h1>Booths</h1>
      <div class="user-chip">
        <div class="avatar" id="userInitial">O</div>
        <span id="userName">Organizer</span>
      </div>
    </div>

    <div class="dash-body">

      <div class="panel">
        <div class="panel-head">
          <h3>Booths by Hall</h3>
          <button class="btn btn-copper" id="openCreateModal">+ New Booth</button>
        </div>

        <div class="toolbar">
          <select id="hallFilter">
            <!-- options injected by booths.js -->
          </select>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="available">Available</option>
            <option value="booked">Booked</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Booth Number</th>
              <th>Hall</th>
              <th>Size</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="boothsBody">
            <!-- rows injected by booths.js -->
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<!-- Create Booth Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Add New Booth</h3>
      <button class="modal-close" id="closeCreateModal">&times;</button>
    </div>
    <form id="createBoothForm">
      <div class="modal-body">
        <div class="field">
          <label for="hall_id">Hall</label>
          <select id="hall_id" name="hall_id" required>
            <!-- options injected by booths.js -->
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="booth_number">Booth number</label>
            <input type="text" id="booth_number" name="booth_number" placeholder="e.g. A-12" required>
          </div>
          <div class="field">
            <label for="size">Size</label>
            <input type="text" id="size" name="size" placeholder="e.g. 3x3 m">
          </div>
        </div>
        <div class="field">
          <label for="location">Location note</label>
          <input type="text" id="location" name="location" placeholder="e.g. Near main entrance">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="available">Available</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
        <div class="error-text" id="createFormError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost-light" id="cancelCreate">Cancel</button>
        <button type="submit" class="btn btn-copper">Add Booth</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/booths.js"></script>
</body>
</html>
