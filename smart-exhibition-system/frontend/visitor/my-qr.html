<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My QR Code — EXHIBIT/OS</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> EXHIBIT/OS</div>
    <div class="role-tag">Visitor Panel</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="browse-exhibitions.html">Browse Exhibitions</a>
      <a href="my-qr.html" class="active">My QR Code</a>
      <a href="feedback.html">Feedback</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" class="logout-link">← Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h1>My QR Code</h1>
      <div class="user-chip">
        <div class="avatar" id="userInitial">V</div>
        <span id="userName">Visitor</span>
      </div>
    </div>

    <div class="dash-body">
      <div class="panel" style="max-width:460px; margin:0 auto;">
        <div style="padding:40px; text-align:center;">
          <p style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:20px;">Show this at entry</p>

          <svg id="qrPlaceholder" width="220" height="220" viewBox="0 0 220 220" style="margin:0 auto; display:block; border:1px solid #D8E2EC; border-radius:4px;">
            <rect width="220" height="220" fill="#fff"/>
            <!-- simple placeholder QR-like pattern -->
            <g fill="#0B2E4F">
              <rect x="20" y="20" width="50" height="50"/>
              <rect x="30" y="30" width="30" height="30" fill="#fff"/>
              <rect x="38" y="38" width="14" height="14" fill="#0B2E4F"/>
              <rect x="150" y="20" width="50" height="50"/>
              <rect x="160" y="30" width="30" height="30" fill="#fff"/>
              <rect x="168" y="38" width="14" height="14" fill="#0B2E4F"/>
              <rect x="20" y="150" width="50" height="50"/>
              <rect x="30" y="160" width="30" height="30" fill="#fff"/>
              <rect x="38" y="168" width="14" height="14" fill="#0B2E4F"/>
              <rect x="90" y="20" width="10" height="10"/><rect x="110" y="20" width="10" height="10"/>
              <rect x="90" y="40" width="10" height="10"/><rect x="130" y="40" width="10" height="10"/>
              <rect x="100" y="60" width="10" height="10"/><rect x="120" y="60" width="10" height="10"/>
              <rect x="90" y="80" width="10" height="10"/><rect x="110" y="90" width="10" height="10"/>
              <rect x="130" y="100" width="10" height="10"/><rect x="90" y="110" width="10" height="10"/>
              <rect x="150" y="90" width="10" height="10"/><rect x="170" y="110" width="10" height="10"/>
              <rect x="90" y="130" width="10" height="10"/><rect x="110" y="140" width="10" height="10"/>
              <rect x="130" y="150" width="10" height="10"/><rect x="150" y="130" width="10" height="10"/>
              <rect x="170" y="150" width="10" height="10"/><rect x="190" y="90" width="10" height="10"/>
              <rect x="90" y="170" width="10" height="10"/><rect x="110" y="180" width="10" height="10"/>
              <rect x="130" y="190" width="10" height="10"/><rect x="150" y="170" width="10" height="10"/>
              <rect x="170" y="190" width="10" height="10"/>
            </g>
          </svg>

          <p id="visitorCode" style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--navy); margin-top:20px; letter-spacing:0.05em;">VISITOR-000000</p>
          <p style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;" id="visitorNameLabel">—</p>

          <div style="margin-top:28px; padding-top:20px; border-top:1px dashed #D8E2EC; font-size:12.5px; color:var(--ink-soft); text-align:left;">
            Organizers scan this code at the entrance and at booths to log your visit. Each check-in helps exhibitors know who stopped by.
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/my-qr.js"></script>
</body>
</html>
